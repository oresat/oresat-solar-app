CONFIG_GPIO=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_ORESAT_COMMON_LIB=y

CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_SENSOR_ASYNC_API=y
CONFIG_I2C_SENSORS=y
CONFIG_I2C_MCUX_LPI2C_BUS_RECOVERY=y

CONFIG_DAC=y
CONFIG_DAC_LT1618=y

CONFIG_SOLAR=y

CONFIG_CAN_INTF=y
