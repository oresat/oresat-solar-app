CONFIG_GPIO=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_ORESAT_COMMON_LIB=y

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=4096

CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_SENSOR_ASYNC_API=y
CONFIG_I2C_SENSORS=y
CONFIG_I2C_MCUX_LPI2C_BUS_RECOVERY=y

CONFIG_DAC=y
CONFIG_DAC_LT1618=y

CONFIG_SOLAR=y

# enable CAN data interface
CONFIG_CAN_INTF=y
CONFIG_CAN_MAX_FILTER=12
CONFIG_CANOPENNODE_SDO_BUFFER_SIZE=889
CONFIG_CAN_DEFAULT_BITRATE=1000000
CONFIG_CANOPENNODE_SYNC_THREAD=n

# enable boot loader
CONFIG_MCUBOOT_ALLOWED=n

CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=20480
CONFIG_LOG_PRINTK=y
CONFIG_CBPRINTF_FP_SUPPORT=y

CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_SENSOR_LOG_LEVEL_INF=y
CONFIG_KERNEL_LOG_LEVEL_INF=y
CONFIG_DAC_LOG_LEVEL_INF=y
CONFIG_CANOPEN_LOG_LEVEL_DBG=y
CONFIG_CAN_LOG_LEVEL_DBG=y

CONFIG_ASSERT=y

CONFIG_DEVICE_DT_METADATA=y
CONFIG_REBOOT=y

# changes for settings
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_RUNTIME=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# changes for shell
CONFIG_SHELL=y
#CONFIG_SHELL_CMDS=y
CONFIG_SHELL_LOG_BACKEND=y

